name: Distribution packages

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, closed]

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.event.pull_request.number }}-${{ github.event.action == 'closed' && 'publish' || 'preview' }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  packages:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      (github.event.action != 'closed' || github.event.pull_request.merged)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:26.04
          - distro: fedora
            image: fedora:45
          - distro: arch
            image: archlinux:base
    container: ${{ matrix.image }}
    steps:
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.distro }}" in
            ubuntu)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cargo gcc libc6-dev make git ca-certificates python3
              ;;
            fedora) dnf -y install cargo gcc make rpm-build git ca-certificates python3 ;;
            arch) pacman -Syu --noconfirm base-devel git rust python systemd dkms python-build python-installer python-setuptools python-wheel pyside6 desktop-file-utils qt6-declarative mesa ;;
          esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fetch pinned backend source
        shell: bash
        run: |
          set -euo pipefail
          sha=$(python3 -c 'import json; print(json.load(open("distribution/release.json"))["backend"])')
          [[ $sha =~ ^[0-9a-f]{40}$ ]]
          git clone --no-checkout https://github.com/srdiogo/minifuse-backend.git /tmp/minifuse-backend
          git -C /tmp/minifuse-backend merge-base --is-ancestor "$sha" origin/main
          git -C /tmp/minifuse-backend checkout --detach "$sha"
      - name: Build and check packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/release-assets
          version=$(python3 -c 'import json; print(json.load(open("distribution/release.json"))["version"])')
          case "${{ matrix.distro }}" in
            ubuntu)
              /tmp/minifuse-backend/packaging/native/build.sh "$version" "$GITHUB_WORKSPACE" /tmp/release-assets
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /tmp/release-assets/*.deb
              python3 /tmp/minifuse-backend/packaging/native/smoke.py
              ;;
            fedora)
              /tmp/minifuse-backend/packaging/native/build.sh "$version" "$GITHUB_WORKSPACE" /tmp/release-assets
              dnf -y install /tmp/release-assets/*.rpm
              python3 /tmp/minifuse-backend/packaging/native/smoke.py
              ;;
            arch)
              git config --global --add safe.directory "$GITHUB_WORKSPACE"
              python /tmp/minifuse-backend/tools/prepare_arch_package.py --output /tmp/arch-backend
              python tools/prepare_arch_package.py --output /tmp/arch-gui
              useradd --create-home builder
              mkdir /tmp/arch-bundle
              for tree in /tmp/arch-backend /tmp/arch-gui; do
                chown -R builder:builder "$tree"
                runuser -u builder -- sh -c 'cd "$1" && sha256sum -c SHA256SUMS && makepkg --cleanbuild --noconfirm' sh "$tree"
                cp "$tree/"*.pkg.tar.zst /tmp/arch-bundle/
              done
              tar -C /tmp/arch-bundle -czf "/tmp/release-assets/minifuse-control-$version-arch-x86_64.tar.gz" .
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.distro }}
          path: /tmp/release-assets/
          if-no-files-found: error

  publish:
    if: github.event.action == 'closed' && github.event.pull_request.merged
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: assets
          merge-multiple: true
      - name: Publish versioned prerelease with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("distribution/release.json"))["version"])')
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 -c 'import json,sys; data=json.load(open("distribution/release.json")); data["gui"]=sys.argv[1]; print(json.dumps(data, indent=2))' "$(git rev-parse HEAD)" > assets/SOURCES.json
          (cd assets && sha256sum -- * > /tmp/MINIFUSE-SHA256SUMS)
          mv /tmp/MINIFUSE-SHA256SUMS assets/SHA256SUMS
          gh release create "v$version" assets/* --target "$(git rev-parse HEAD)" \
            --prerelease --title "MiniFuse Control $version" --notes-file distribution/RELEASE-NOTES.md
