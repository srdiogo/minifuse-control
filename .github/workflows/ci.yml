name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
        style: ['Basic', 'Fusion']
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_PLATFORMTHEME: ''
      QT_QUICK_CONTROLS_STYLE: ${{ matrix.style }}
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 desktop-file-utils
      - run: pip install '.[gui,dev]' 'setuptools>=77' build installer
      - run: ruff check src tests tools --select E4,E7,E9,F
      - run: ruff format --check src tests tools
      - run: python -m unittest discover -s tests -v
      - run: pyside6-qmllint src/minifuse_control/qml/*.qml
      - run: python -m build --no-isolation
      - run: python tools/check_distribution.py dist/minifuse_control-0.1.0-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.14' && matrix.style == 'Fusion'
        with:
          name: minifuse-control-python-preview
          path: dist/*

  arch-packages:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm base-devel git python-build python-installer python-setuptools python-wheel pyside6 desktop-file-utils qt6-declarative mesa
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build split packages as an unprivileged user
        run: |
          useradd --create-home builder
          install -d -o builder -g builder /tmp/package
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python tools/prepare_arch_package.py --output /tmp/package/export
          chown -R builder:builder /tmp/package/export
          runuser -u builder -- sh -c 'cd /tmp/package/export && sha256sum -c SHA256SUMS && makepkg --cleanbuild --noconfirm'
      - uses: actions/upload-artifact@v4
        with:
          name: minifuse-control-arch-preview
          path: |
            /tmp/package/export/*.pkg.tar.zst
            /tmp/package/export/PKGBUILD
            /tmp/package/export/source-lock.json
            /tmp/package/export/SHA256SUMS
